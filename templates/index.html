<!DOCTYPE html>
<html>
<head>
  <title>SkyNetra Dashboard</title>

  <style>
    body {
      background: radial-gradient(circle at top, #0f172a, #020617);
      color: white;
      font-family: 'Segoe UI', Arial;
      padding: 30px;
    }

    h1 {
      color: #38bdf8;
      font-size: 32px;
      margin-bottom: 10px;
    }

    .container {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 20px;
      align-items: start;
    }

    .video-box {
      background: rgba(30,41,59,0.6);
      padding: 15px;
      border-radius: 16px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 30px rgba(0,0,0,0.3);
    }

    img {
      width: 100%;
      border-radius: 12px;
    }

    .panel {
      background: rgba(30,41,59,0.6);
      padding: 15px;
      border-radius: 16px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 30px rgba(0,0,0,0.3);
    }

    #tracks {
      margin-top: 10px;
    }

    .card {
      background: rgba(15,23,42,0.8);
      padding: 14px;
      margin-bottom: 12px;
      border-radius: 12px;
      border-left: 4px solid gray;
      transition: 0.2s;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 12px rgba(56,189,248,0.2);
    }

    .title {
      font-size: 14px;
      color: #94a3b8;
    }

    .value {
      font-size: 18px;
      font-weight: bold;
    }

    .confidence {
      color: #22d3ee;
      font-weight: bold;
    }

    .trust-high { color: #22c55e; }
    .trust-med { color: #f59e0b; }
    .trust-low { color: #ef4444; }

    .bars {
      margin-top: 10px;
    }

    .bar-label {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 6px;
    }

    .bar-bg {
      background: #020617;
      height: 6px;
      border-radius: 6px;
    }

    .bar-fill {
      height: 100%;
      border-radius: 6px;
    }

    .explain {
      margin-top: 10px;
      font-size: 13px;
      color: #94a3b8;
      font-style: italic;
    }

  </style>
</head>

<body>

<h1>🚀 SkyNetra Dashboard</h1>

<div class="container">

  <!-- LEFT: VIDEO -->
  <div class="video-box">
    <img src="http://localhost:5000/video">
  </div>

  <!-- RIGHT: PANEL -->
  <div class="panel">
    <h3>Detected People</h3>
    <div id="tracks">Loading...</div>
  </div>

</div>

<script>

// 🔥 Cleaner bar
function bar(value) {
  const color = value > 0.8 ? "#22c55e" : value > 0.6 ? "#f59e0b" : "#ef4444";

  return `
    <div class="bar-bg">
      <div class="bar-fill" style="width:${value*100}%; background:${color};"></div>
    </div>
  `;
}

async function update() {
  try {
    const res = await fetch("http://localhost:5000/state");
    const data = await res.json();

    const container = document.getElementById("tracks");
    container.innerHTML = "";

    if (data.tracks.length === 0) {
      container.innerHTML = "No faces detected";
      return;
    }

    data.tracks.forEach(t => {

      let color = "gray";
      if (t.confidence > 0.8) color = "#22c55e";
      else if (t.confidence > 0.6) color = "#f59e0b";
      else color = "#ef4444";

      const div = document.createElement("div");
      div.className = "card";
      div.style.borderLeftColor = color;

        // 🔥 ADD THIS HERE
      if (t.needs_confirmation) {
          div.style.boxShadow = "0 0 12px rgba(245,158,11,0.6)";
      }

      div.innerHTML = `
        <div class="title">ID ${t.id}</div>
        <div class="value">${t.name}</div>

        <div class="confidence">Confidence: ${t.confidence}</div>

        <div class="${t.trust === 'HIGH' ? 'trust-high' : t.trust === 'MEDIUM' ? 'trust-med' : 'trust-low'}">
          ${t.trust}
        </div>

        <div class="bars">

          <div class="bar-label">Match (${t.raw_conf})</div>
          ${bar(t.raw_conf)}

          <div class="bar-label">Quality (${t.quality})</div>
          ${bar(t.quality)}

          <div class="bar-label">Temporal (${t.temporal})</div>
          ${bar(t.temporal)}

        </div>

        <div class="explain">
          ${
            (() => {
              let reasons = [];

              if (t.raw_conf > 0.8) reasons.push("strong facial match");
              else if (t.raw_conf > 0.6) reasons.push("moderate similarity");
              else reasons.push("weak match");

              if (t.quality > 0.8) reasons.push("clear input");
              else if (t.quality < 0.5) reasons.push("low quality");

              if (t.temporal > 0.8) reasons.push("stable tracking");
              else if (t.temporal < 0.5) reasons.push("unstable tracking");

              return "Confidence is " + t.trust.toLowerCase() + " because " + reasons.join(", ");
            })()
          }
        </div>
        ${t.needs_confirmation && t.face ? `
        <div style="
            margin-top:12px;
            padding:12px;
            background:rgba(245,158,11,0.08);
            border:1px solid rgba(245,158,11,0.3);
            border-radius:10px;
        ">

            <div style="font-size:12px; color:#f59e0b; margin-bottom:6px;">
            ⚠️ Needs human confirmation
            </div>

            <div style="font-size:11px; color:#94a3b8; margin-bottom:6px;">
            Detected face snapshot
            </div>

            <img 
            src="data:image/jpeg;base64,${t.face}" 
            width="110" 
            style="border-radius:8px; margin-bottom:10px;"
            >

            <div id="confirm-${t.id}">
            <button onclick="handleConfirm(${t.id}, true)" style="
                background:#22c55e; border:none; padding:6px 12px; margin-right:6px; border-radius:6px; cursor:pointer;">
                ✔ YES
            </button>

            <button onclick="handleConfirm(${t.id}, false)" style="
                background:#ef4444; border:none; padding:6px 12px; border-radius:6px; cursor:pointer;">
                ✖ NO
            </button>
            </div>

        </div>
        ` : ""}
      `;

      container.appendChild(div);
    });

  } catch {
    document.getElementById("tracks").innerHTML = "⚠️ Cannot connect to backend";
  }
}

async function handleConfirm(id, result) {
  try {
    await fetch("http://localhost:5000/confirm", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        id: id,
        result: result
      })
    });

    // 🔥 Instant UI feedback
    const el = document.getElementById(`confirm-${id}`);
    if (el) {
      el.innerHTML = `
        <div style="
          color:${result ? '#22c55e' : '#ef4444'};
          font-weight:bold;
          font-size:13px;
        ">
          ${result ? "✔ Confirmed" : "✖ Rejected"}
        </div>
      `;
    }

  } catch (err) {
    console.error("Error:", err);
  }
}
setInterval(update, 500);

</script>

</body>
</html>
